<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Bảo tàng ảo 3D</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0c0f14;
      --card-bg: #141923;
      --card-border: #222b3d;
      --accent: #d4a359;
      --accent-soft: rgba(212, 163, 89, 0.15);
      --text: #f0f3f8;
      --text-muted: #94a3b8;
      --font-body: 'Be Vietnam Pro', system-ui, sans-serif;
      --font-serif: 'Playfair Display', Georgia, serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      font-size: 16px;
      line-height: 1.5;
      user-select: none;
      -webkit-user-select: none;
    }

    /* Khung 3D Three.js */
    #stage {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      outline: none;
      touch-action: none;
    }

    /* HUD Giao diện người dùng */
    #hud-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 10;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 16px;
    }

    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      pointer-events: auto;
    }

    .brand-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(15, 20, 30, 0.75);
      border: 1px solid rgba(212, 163, 89, 0.3);
      backdrop-filter: blur(8px);
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 14px;
      color: #f1f5f9;
    }

    .brand-badge strong {
      color: var(--accent);
      font-family: var(--font-serif);
      font-size: 16px;
    }

    .guide-tag {
      font-size: 13px;
      color: #cbd5e1;
      background: rgba(255, 255, 255, 0.08);
      padding: 2px 8px;
      border-radius: 4px;
    }

    .help-btn {
      background: rgba(15, 20, 30, 0.75);
      border: 1px solid var(--card-border);
      color: var(--text);
      font-family: inherit;
      font-size: 14px;
      padding: 6px 14px;
      border-radius: 8px;
      cursor: pointer;
      backdrop-filter: blur(8px);
      transition: all 0.2s ease;
    }

    .help-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .help-btn:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    /* Tâm ngắm (Crosshair) */
    .crosshair {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 8px;
      height: 8px;
      background: rgba(255, 255, 255, 0.65);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      box-shadow: 0 0 6px rgba(0, 0, 0, 0.8);
      transition: transform 0.15s ease, background 0.15s ease;
    }

    /* Hướng dẫn phím nhanh ở đáy màn hình */
    .bottom-hint {
      align-self: center;
      background: rgba(15, 20, 30, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(6px);
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 13px;
      color: var(--text-muted);
      pointer-events: none;
    }

    @media (max-width: 600px) {
      .bottom-hint {
        display: none; /* Ẩn gợi ý phím trên mobile vì đã có cần ảo */
      }
      .brand-badge {
        font-size: 13px;
      }
      .brand-badge strong {
        font-size: 14px;
      }
    }
  </style>
</head>
<body>
  <!-- Canvas Three.js -->
  <canvas id="stage" tabindex="0"></canvas>

  <!-- Lớp HUD hiển thị thông tin -->
  <div id="hud-layer">
    <header class="top-bar">
      <div class="brand-badge">
        <span>🏛️</span>
        <strong id="hud-museum-name">Bảo tàng ảo 3D</strong>
        <span class="guide-tag" id="hud-guide-name">Hướng dẫn viên</span>
      </div>
      <button type="button" class="help-btn" id="btn-show-help" aria-label="Xem hướng dẫn điều khiển">
        ℹ️ Hướng dẫn [H]
      </button>
    </header>

    <!-- Tâm ngắm -->
    <div class="crosshair" aria-hidden="true"></div>

    <div class="bottom-hint">
      Di chuyển: <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> • Nhìn: <kbd>Kéo chuột</kbd> • Chạy nhanh: <kbd>Shift</kbd>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
