<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bảo tàng ảo 3D</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0c0f14;
      --card-bg: #141923;
      --card-border: #222b3d;
      --accent: #d4a359;
      --accent-soft: rgba(212, 163, 89, 0.15);
      --text: #f0f3f8;
      --text-muted: #94a3b8;
      --danger: #ef4444;
      --danger-bg: rgba(239, 68, 68, 0.12);
      --danger-border: #7f1d1d;
      --success: #10b981;
      --success-bg: rgba(16, 185, 129, 0.12);
      --font-body: 'Be Vietnam Pro', system-ui, sans-serif;
      --font-serif: 'Playfair Display', Georgia, serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      font-size: 16px;
      line-height: 1.6;
      min-height: 100vh;
      padding: 32px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    #app {
      width: 100%;
      max-width: 960px;
    }

    .header {
      margin-bottom: 32px;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--card-border);
    }

    .badge {
      display: inline-block;
      padding: 4px 12px;
      background: var(--accent-soft);
      color: var(--accent);
      border: 1px solid rgba(212, 163, 89, 0.3);
      border-radius: 9999px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    .museum-title {
      font-family: var(--font-serif);
      font-size: clamp(28px, 4vw, 42px);
      font-weight: 700;
      color: var(--text);
      line-height: 1.2;
      margin-bottom: 12px;
    }

    .museum-welcome {
      font-size: 17px;
      color: var(--text-muted);
      max-width: 720px;
      margin-bottom: 16px;
    }

    .meta-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      font-size: 14px;
      color: var(--accent);
    }

    .meta-item {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 255, 255, 0.03);
      padding: 6px 14px;
      border-radius: 8px;
      border: 1px solid var(--card-border);
    }

    .section-title {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .room-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
      margin-bottom: 32px;
    }

    @media (min-width: 640px) {
      .room-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    .room-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .room-card:hover {
      border-color: rgba(212, 163, 89, 0.4);
      transform: translateY(-2px);
    }

    .room-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
    }

    .room-name {
      font-size: 18px;
      font-weight: 700;
      color: var(--text);
    }

    .room-id {
      font-size: 12px;
      font-family: monospace;
      color: var(--accent);
      background: var(--accent-soft);
      padding: 2px 8px;
      border-radius: 4px;
      white-space: nowrap;
    }

    .room-theme {
      font-size: 14px;
      font-weight: 500;
      color: var(--accent);
    }

    .room-intro {
      font-size: 14.5px;
      color: var(--text-muted);
      flex-grow: 1;
    }

    .room-guide-quote {
      font-size: 13.5px;
      font-style: italic;
      color: #cbd5e1;
      background: rgba(0, 0, 0, 0.25);
      border-left: 3px solid var(--accent);
      padding: 10px 14px;
      border-radius: 0 6px 6px 0;
    }

    .room-details {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      padding-top: 12px;
      border-top: 1px solid var(--card-border);
      font-size: 13px;
      color: var(--text-muted);
    }

    .detail-tag {
      display: flex;
      flex-direction: column;
    }

    .detail-tag span:first-child {
      color: #64748b;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .exhibit-preview {
      margin-top: 4px;
      font-size: 13px;
      color: #cbd5e1;
    }

    .exhibit-item {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 4px;
    }

    .status-banner {
      background: var(--success-bg);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: #a7f3d0;
      border-radius: 8px;
      padding: 14px 18px;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* Error styling */
    .error-card {
      background: var(--danger-bg);
      border: 1px solid var(--danger-border);
      border-radius: 12px;
      padding: 28px;
      margin-top: 20px;
    }

    .error-title {
      font-size: 20px;
      font-weight: 700;
      color: #fca5a5;
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    .error-message {
      font-size: 16px;
      color: #fee2e2;
      background: rgba(0, 0, 0, 0.3);
      padding: 16px;
      border-radius: 8px;
      border-left: 4px solid var(--danger);
      margin-bottom: 16px;
      white-space: pre-wrap;
      font-family: monospace;
    }

    .error-hint {
      font-size: 14px;
      color: #fca5a5;
      line-height: 1.5;
    }

    .btn-retry {
      margin-top: 16px;
      background: var(--danger);
      color: #fff;
      border: none;
      padding: 8px 18px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-retry:hover {
      background: #dc2626;
    }

    .loading-container {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid var(--card-border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <main id="app">
    <div class="loading-container">
      <div class="spinner"></div>
      <p>Đang đọc dữ liệu bảo tàng từ public/data/museum.json...</p>
    </div>
  </main>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
